name: Trigger auto deployment for ca-hello

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-hello-AutoDeployTrigger-8622c7d8-dedd-4682-86eb-b5582debe664.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAHELLO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAHELLO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAHELLO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrai8hina.azurecr.io
          registryUsername: ${{ secrets.CAHELLO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAHELLO_REGISTRY_PASSWORD }}
          containerAppName: ca-hello
          resourceGroup: rg-ai-w8-labs
          imageToBuild: acrai8hina.azurecr.io/ca-hello:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


